var EASY={"visa_free":1,"visa_waiver":1,"freedom_of_movement":1,"visa_on_arrival":1,"eta":1};
function wcls(t){return t<15?'cold':t<29?'mild':t<34?'warm':'hot'}
function warm_ar(c){return {cold:'Cold',mild:'Mild',warm:'Warm',hot:'Hot'}[c]}
function render(){
 var m=+document.getElementById('fm').value||0;
 var w=document.getElementById('fw').value;
 var p=document.getElementById('fp').value;
 var v=document.getElementById('fv').checked;
 var q=(document.getElementById('fq').value||'').trim();
 var out=[];
 for(var i=0;i<D.length;i++){var d=D[i];
  if(q&&d.a.indexOf(q)<0&&d.e.toLowerCase().indexOf(q.toLowerCase())<0&&d.c.indexOf(q)<0)continue;
  var mi=m?m-1:pick(d);var cls=wcls(d.t[mi]);

  if(v){var pp=p||'SA';if(!d.v[pp]||!EASY[d.v[pp]])continue}
  out.push({d:d,mi:mi,cls:cls});}

['fm','fw','fp','fv','fq'].forEach(function(id){document.getElementById(id).addEventListener(id==='fq'?'input':'change',render)});
