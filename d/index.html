var D=JSON.parse(document.getElementById('data').textContent);
var EASY={"visa_free":1,"visa_waiver":1,"freedom_of_movement":1,"visa_on_arrival":1,"eta":1};
function wcls(t){return t<15?'cold':t<29?'mild':t<34?'warm':'hot'}
function warm_ar(c){return {cold:'باردة',mild:'معتدلة',warm:'دافئة',hot:'حارة'}[c]}
function render(){
 var m=+document.getElementById('fm').value||0;
 var w=document.getElementById('fw').value;
 var p=document.getElementById('fp').value;
 var v=document.getElementById('fv').checked;
 var q=(document.getElementById('fq').value||'').trim();
 var out=[];
 for(var i=0;i<D.length;i++){var d=D[i];
  if(q&&d.a.indexOf(q)<0&&d.e.toLowerCase().indexOf(q.toLowerCase())<0&&d.c.indexOf(q)<0)continue;
  var mi=m?m-1:pick(d);var cls=wcls(d.t[mi]);
  if(w&&cls!==w)continue;
  if(v){var pp=p||'SA';if(!d.v[pp]||!EASY[d.v[pp]])continue}
  out.push({d:d,mi:mi,cls:cls});}
 var n=out.length;var noun=(n>=3&&n<=10)?'وجهات':'وجهة';
 document.getElementById('fc').textContent=n+' '+noun;
 document.getElementById('cards').innerHTML=out.slice(0,120).map(function(x){
  var d=x.d;return '<a class="dest" href="'+d.s+'/">'
  +'<div class="head">'+d.f+' '+d.a+'<small>'+d.c+'</small></div>'
  +'<div class="body">'+MON[x.mi]+': '+Math.round(d.t[x.mi])+'° '+warm_ar(x.cls)
  +(d.n?' · مباشر من الخليج':'')+'</div></a>';}).join('');
}
function pick(d){var n=new Date().getMonth();for(var k=0;k<12;k++){var i=(n+1+k)%12;if(wcls(d.t[i])==='mild')return i}return (n+1)%12}
var MON=["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
['fm','fw','fp','fv','fq'].forEach(function(id){document.getElementById(id).addEventListener(id==='fq'?'input':'change',render)});
render();
